<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prokritir Haat – Pure Organic Food, Delivered</title>
<meta name="description" content="Pure honey, spices, ghee, dates and nuts. Cash on delivery across Bangladesh.">
<style>
:root{--bg:#faf6f0;--surface:#fff;--ink:#1d2523;--muted:#68726e;--line:#e8e1d6;--nav:#0d2b2a;--org:#f28c1e;--red:#c8321e;--tile:#f6f0e6;--soft:#f3efe8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101716;--surface:#18211f;--ink:#eef2ee;--muted:#9fb0aa;--line:#2a3835;--tile:#202c29;--soft:#202c29;--red:#ff846e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101716;--surface:#18211f;--ink:#eef2ee;--muted:#9fb0aa;--line:#2a3835;--tile:#202c29;--soft:#202c29;--red:#ff846e;color-scheme:dark}
html{scroll-padding-top:150px;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top{background:var(--surface)}
.bar{display:flex;align-items:center;gap:26px;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--org);font-weight:800;line-height:1;font-size:1.15rem;letter-spacing:.5px;white-space:nowrap}
.logo i{width:48px;height:48px;border-radius:14px;background:var(--org);display:grid;place-items:center}
.search{flex:1;display:flex;background:var(--soft);border-radius:12px;min-width:0}
.search input{flex:1;border:0;background:none;padding:14px 18px;min-width:0}
.search button{background:none;border:0;padding:0 16px}
.acts{display:flex;gap:22px}
.act{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:.92rem;position:relative;padding:0;color:var(--ink)}
.act svg,.search svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.act em{position:absolute;top:-6px;right:-2px;background:var(--org);color:#fff;font-style:normal;font-size:.72rem;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center}
nav{background:var(--nav)}
nav .wrap{display:flex;gap:30px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:#fff;padding:22px 0;font-size:1.05rem;white-space:nowrap;border-bottom:3px solid transparent}
nav button[aria-current="true"]{border-color:var(--org)}
.hero{display:grid;grid-template-columns:2.05fr 1fr;gap:20px;padding:28px 0 8px}
.slider{position:relative;border-radius:18px;overflow:hidden;min-height:400px}
.sl{position:absolute;inset:0;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;padding:0 44px;opacity:0;transition:opacity .6s;pointer-events:none;color:#2a1c06}
.sl.on{opacity:1;pointer-events:auto}
.sl h1{font-size:clamp(1.9rem,3.6vw,3.2rem);line-height:1.12;margin:0 0 12px;letter-spacing:-.5px}
.sl p{margin:0 0 22px;font-size:1.1rem;opacity:.8}
.sl .art{height:86%;justify-self:center}
.sl .art svg{height:100%;width:auto;filter:drop-shadow(0 18px 18px rgba(0,0,0,.22))}
.btn{display:inline-block;background:var(--org);color:#fff;border:0;border-radius:10px;padding:12px 24px;font-weight:700}
.dots{position:absolute;left:44px;bottom:20px;display:flex;gap:8px}
.dots button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:rgba(0,0,0,.25)}
.dots button[aria-current="true"]{background:var(--org)}
.promo{border-radius:18px;background:linear-gradient(160deg,#f6a13a,#d4660a);color:#fff;padding:28px 26px;display:flex;flex-direction:column;overflow:hidden}
.promo small{font-weight:600;opacity:.9}
.promo h2{font-size:2.2rem;line-height:1.1;margin:6px 0 14px}
.promo .trio{display:flex;justify-content:center;gap:0;margin-top:auto}
.promo .trio svg{width:34%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.3))}
.promo .trio svg:nth-child(2){transform:translateY(-10px) scale(1.1)}
.promo .btn{background:#fff;color:#a8500a;align-self:flex-start}
h2.sec{text-align:center;font-size:1.8rem;font-weight:500;margin:36px 0 20px}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 10px 12px;text-align:center;font-weight:600}
.cat svg{height:96px;width:auto}
.cat:hover{border-color:var(--org)}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:40px 0 16px}
.sh h2{margin:0;font-size:1.6rem}
.sh span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:200px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 85%,var(--tile),var(--surface) 75%);position:relative}
.pic svg,.pic img{height:84%;width:auto;max-width:90%;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18))}
.off{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-size:.78rem;font-weight:700;border-radius:6px;padding:1px 8px}
.wish{position:absolute;top:8px;right:8px;background:var(--surface);border:1px solid var(--line);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;padding:0}
.wish svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2}
.wish[aria-pressed="true"] svg{fill:var(--red);stroke:var(--red)}
.info{padding:12px 16px 16px;display:flex;flex-direction:column;flex:1}
.info h3{margin:0;font-size:1.02rem;line-height:1.35}
.info small{color:var(--muted)}
.price{margin-top:auto;padding-top:8px;font-weight:700;font-size:1.2rem}
.price s{color:var(--muted);font-weight:400;font-size:.9rem;margin-left:6px}
.add{margin-top:10px;border:2px solid var(--org);background:transparent;border-radius:10px;padding:8px;font-weight:700;color:var(--ink)}
.add:hover{background:var(--org);color:#fff}
.empty{grid-column:1/-1;color:var(--muted);padding:24px 0}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;background:var(--nav);color:#fff;border-radius:18px;padding:30px;margin:46px 0}
.feat h3{margin:0 0 4px}.feat p{margin:0;opacity:.8}
footer{border-top:1px solid var(--line);padding:26px 0 90px;color:var(--muted);font-size:.93rem}
.fcart{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:25;width:98px;border:0;padding:0;border-radius:12px 0 0 12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.fcart b{display:block;background:var(--org);color:#fff;padding:12px 4px 8px;font-weight:500}
.fcart b svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;display:block;margin:0 auto 2px}
.fcart span{display:block;background:var(--surface);color:var(--org);font-weight:700;padding:10px 4px}
.chat{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;width:62px;height:62px;border-radius:18px;background:var(--org);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.chat svg{width:30px;height:30px;fill:#fff}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}.shade.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside.on{transform:none}
.ah{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.ah h2{margin:0;font-size:1.2rem}.x{background:none;border:0;font-size:1.7rem;line-height:1}
.items{flex:1;overflow:auto;padding:6px 20px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row .e{width:58px;height:58px;border-radius:10px;background:var(--tile);display:grid;place-items:center;flex:none}
.row .e svg,.row .e img{height:48px;width:auto}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600;line-height:1.3}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.co{padding:14px 20px;border-top:1px solid var(--line);display:grid;gap:8px}
.co input,.co textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.sum{display:flex;justify-content:space-between}.sum.tot{font-weight:700;font-size:1.15rem}
.wa{background:#1a8a4a;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700}
.err{color:var(--red);font-size:.9rem;min-height:1.2em;margin:0}.note{color:var(--muted);font-size:.85rem;margin:0}
@media (max-width:1000px){.hero{grid-template-columns:1fr}.promo{min-height:300px}.cats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.bar{flex-wrap:wrap;gap:12px}.search{order:3;flex:1 1 100%}.acts{gap:14px;margin-left:auto}.act span{display:none}.logo{font-size:1rem}
.slider{min-height:380px}.sl{grid-template-columns:1fr;padding:22px;align-content:start;gap:0}.sl .art{height:170px;order:-1;margin-bottom:8px}.dots{left:22px}.sl p{margin-bottom:14px}.fcart{top:auto;bottom:96px;transform:none}nav .wrap{gap:22px}nav button{padding:16px 0}html{scroll-padding-top:200px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.logo span{max-width:130px;text-transform:uppercase}
.lnk{background:none;border:0;color:var(--org);font-weight:600;padding:0}
.ah .r{display:flex;gap:16px;align-items:center}
.row .side{display:grid;justify-items:end;gap:8px}
.rm{background:none;border:0;color:var(--red);padding:4px;display:flex;align-items:center;gap:4px;font-size:.9rem;font-weight:600}
.rm svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.rm:hover{color:var(--red)}
.qn{width:54px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:3px}
.sl .art img{height:100%;width:100%;object-fit:contain}.promo .trio img{width:34%;height:auto;object-fit:contain}.cat img{height:96px;width:auto;object-fit:contain}
.add:disabled{opacity:.5;cursor:not-allowed}.add:disabled:hover{background:transparent;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#16221f;color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:92vw}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{background:none;border:0;color:#ffb35c;font-weight:700}
#adm{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}#adm[hidden]{display:none}
.ad{max-width:960px;margin:0 auto;padding:20px 20px 80px}.ad h1{margin:0;font-size:1.6rem}.ad h2{font-size:1.25rem;margin:18px 0 6px}
.atabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.atabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 16px}
.atabs button[aria-pressed="true"]{background:var(--nav);color:#fff;border-color:var(--nav)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:12px 0}
.fg label,.imgf label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.ad input:not([type=checkbox]):not([type=color]),.ad select,.ad textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink)}
.ad input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ck{display:flex!important;align-items:center;gap:8px;color:var(--ink)!important;align-self:end}
details.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}details.pc summary{cursor:pointer}
.imgf{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.imgf>label:first-child{flex:1;min-width:220px}.imgf img{height:56px;border-radius:8px;border:1px solid var(--line)}
.bt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);display:inline-block}.dng{color:var(--red);border-color:var(--red)}
.rw{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}.rw>input{flex:1;min-width:160px}
.ad hr{border:0;border-top:1px solid var(--line);margin:22px 0}.ad .btn{cursor:pointer;text-decoration:none}
aside{overflow-y:auto;overscroll-behavior:contain}aside .ah{position:sticky;top:0;background:var(--surface);z-index:2}aside .items{flex:none;overflow:visible}aside .co{flex:none}
.otw{overflow-x:auto}.ot{width:100%;border-collapse:collapse;font-size:.92rem;min-width:640px}.ot th,.ot td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}.ot th{color:var(--muted);font-weight:600}.ot select{width:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}.kp>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}.kp b{display:block;font-size:1.5rem;line-height:1.3}.kp span{color:var(--muted);font-size:.88rem;display:block}
.chw{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}.chw svg{width:100%;min-width:520px;height:auto;display:block}
a.act{text-decoration:none;color:var(--ink)}.acts{margin-left:auto;position:relative}
.logo{flex:none}.logo span{white-space:normal;max-width:140px;overflow-wrap:anywhere;line-height:1.05}
.search{max-width:360px}.search input{padding:10px 14px}.search svg{width:22px;height:22px}
.menu{position:absolute;right:0;top:calc(100% + 12px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:220px;padding:6px;z-index:40;display:grid}
.menu[hidden]{display:none}.menu a{padding:10px 14px;border-radius:8px;color:var(--ink);text-decoration:none}.menu a:hover{background:var(--soft)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}
.mc{background:var(--surface);border-radius:16px;width:min(440px,100%);max-height:100%;overflow:auto}.mb{padding:16px 20px 22px;display:grid;gap:10px}
.mb input,.mb textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
#abt{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}#abt[hidden]{display:none}
.kp a{color:var(--org);text-decoration:none;font-weight:700}.kp a:hover{text-decoration:underline}
.aimg{max-width:100%;max-height:380px;border-radius:14px;margin:12px 0;object-fit:cover}.atx p{line-height:1.75;font-size:1.05rem;max-width:70ch}
@media (max-width:720px){.search{max-width:none}.acts{gap:12px}.menu{right:-6px}}
.lgi{display:none;height:74px;width:74px;object-fit:contain;border-radius:50%;background:#fff;flex:none}
@media (max-width:720px){.lgi{height:56px;width:56px}}
.mb label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}.mb label.ck{display:flex;gap:8px;align-items:center;color:var(--ink)}.mb input[type=checkbox]{width:auto}
.mb .atabs{margin:0 0 4px}.ord{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}.ord small{color:var(--muted)}
.wrap.bar{padding:14px 20px}
.off,.wish{z-index:2}
.pic{overflow:hidden}.pic img{height:auto;width:auto;max-height:172px;max-width:88%;object-fit:contain;filter:none;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pic img{mix-blend-mode:normal}}
:root[data-theme="dark"] .pic img{mix-blend-mode:normal}
.calc{grid-column:1/-1;margin:0;font-weight:600;color:var(--org)}
.gbox{display:grid;gap:12px;padding-top:30px}.gbox label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}.gbox label.ck{display:flex;gap:8px;align-items:center;color:var(--ink)}.gbox input[type=checkbox]{width:auto}
.rcode{font:700 1.5rem/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;background:var(--surface);border:2px dashed var(--org);border-radius:12px;padding:16px;text-align:center;user-select:all;margin:0}
</style>
</head>
<body>
<header>
 <div class="top"><div class="wrap bar">
  <a class="logo" href="#top" aria-label="Prokritir Haat home"><i><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c0-6 0-9 0-12M12 14C7 14 5 11 5 6c5 0 7 3 7 8zM12 11c0-4 2-6 7-6 0 5-2 7-7 6z"/></svg></i><img id="lgi" class="lgi" alt=""><span id="lg"></span></a>
  <form class="search" id="sf" role="search"><input id="q" type="search" placeholder="Search in…" aria-label="Search products"><button type="submit" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></form>
  <div class="acts">
   <a class="act" id="track" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg><span>Track Order</span></a>
   <button class="act" id="acct" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span id="acl">Sign In</span></button>
   <button class="act" id="wl" type="button"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><em id="wc">0</em><span>Wishlist</span></button>
   <button class="act" id="openCart" type="button"><svg viewBox="0 0 24 24"><path d="M3 4h3l2 11h10l2-8H7"/><circle cx="9" cy="19" r="1"/><circle cx="17" cy="19" r="1"/></svg><em id="count">0</em><span>Cart</span></button>
   <button class="act" id="more" type="button" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h5"/></svg><span>More</span></button>
   <div class="menu" id="moremenu" hidden><a href="#about">About us</a><a href="#info">Delivery &amp; returns</a><a id="mcontact" href="#" target="_blank" rel="noopener">Contact on WhatsApp</a></div>
  </div>
 </div></div>
 <nav><div class="wrap" id="nav" aria-label="Categories"></div></nav>
</header>

<main id="top">
 <div class="wrap">
  <section class="hero">
   <div class="slider" id="slider" aria-roledescription="carousel"></div>
   <div class="promo" id="promo"></div>
  </section>

  <h2 class="sec">Featured Categories</h2>
  <div class="cats" id="cats"></div>

  <div class="sh" id="shop"><h2 id="st">Best Sellers</h2><span id="sc"></span></div>
  <div class="grid" id="grid"></div>

  <div class="feat" id="info"></div>
 </div>
</main>
<footer><div class="wrap"><span id="ft"></span></div></footer>

<button class="fcart" id="fc" type="button" aria-label="Open cart"><b><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8zM9 8a3 3 0 0 1 6 0"/></svg><span style="all:unset" id="fci">0 Items</span></b><span id="fct">৳0.00</span></button>
<a class="chat" id="chat" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></a>

<div id="adm" hidden></div><div id="abt" hidden></div><div id="acc" class="modal" hidden></div><div id="toast" role="status" aria-live="polite"></div>

   :`<label>Full name<input id="ac-n" autocomplete="name"></label>${phf}<label>Delivery address (optional)<textarea id="ac-a" rows="2" autocomplete="street-address"></textarea></label>${pw("ac-w","Password (at least 6 characters)","new-password")}${pw("ac-w2","Confirm password","new-password")}${show}${er}<button class="btn" type="button" data-a3="signup" data-primary>Create account</button>${useDB?"":'<p class="note">Your account is saved on this device only. It won’t appear on other phones or computers.</p>'}`);
 }else if(!cur){
  t="Forgot password";
  h=useDB?DBFORGOT():`<p class="note">Your password is saved only on this device, so it can’t be recovered. You can remove the account from this device and create it again with a new password. Orders saved under this account on this device will be deleted.</p>${phf}${er}<div><button class="btn" type="button" data-a3="reset" data-primary>Remove account</button><button class="lnk" type="button" data-a3="v:in" style="margin-left:16px">Back to sign in</button></div>`;
 }else{
  const L=useDB?myOrd:(orders[cur.ph]||[]);t="Hi, "+esc(cur.n)+"!";
  h=`<div class="atabs"><button type="button" data-a3="v:me" aria-pressed="${mview!="ord"}">Profile</button><button type="button" data-a3="v:ord" aria-pressed="${mview=="ord"}">My orders (${L.length})</button></div>`+(mview=="ord"
   ?(L.length?L.map(r=>`<div class="ord"><b>${esc(r.d)} · ${tk(r.t)}</b><small>${r.items.map(i=>`${esc(i.n)} × ${i.q}`).join(", ")}</small><div><button class="bt" type="button" data-a3="reorder:${r.id}">Order again</button></div></div>`).join(""):`<p class="note">No orders yet. Orders you place while signed in will appear here.</p>`)+`<div><button class="lnk" type="button" data-a3="logout">Sign out</button></div>`
   :`<label>Mobile number<input value="${esc(cur.ph)}" readonly></label><label>Full name<input id="ac-n" value="${esc(cur.n)}" autocomplete="name"></label><label>Delivery address<textarea id="ac-a" rows="2" autocomplete="street-address">${esc(cur.ad)}</textarea></label>${pw("ac-w","New password (leave empty to keep the current one)","new-password")}${show}${er}<div><button class="btn" type="button" data-a3="saveprof" data-primary>Save changes</button><button class="lnk" type="button" data-a3="logout" style="margin-left:16px">Sign out</button></div>`);
 }
 const m=$("acc");m.hidden=false;
 m.innerHTML=`<div class="mc" role="dialog" aria-modal="true" aria-label="Account"><div class="ah"><h2>${t}</h2><button class="x" type="button" data-a3="close" aria-label="Close">×</button></div><div class="mb">${h}</div></div>`;
 const f=m.querySelector("input:not([readonly])");if(f)f.focus()}
function loginAs(u){cur=u;put("session",u.ph);$("nm").value=u.n;$("ph").value=u.ph;$("ad").value=u.ad||"";accUI();renderCart();$("acc").hidden=true;toast("Welcome, "+u.n.split(" ")[0]+"!")}
function recordOrder(sub,sh,ad){if(!cur)return;
 const items=Object.entries(cart).map(([id,q])=>{const x=byId(id);return{id:+id,n:x.n,u:x.u,p:x.p,q}}),sig=JSON.stringify(items);
 if(sig===lastSig&&Date.now()-lastT<60000)return;lastSig=sig;lastT=Date.now();
 (orders[cur.ph]=orders[cur.ph]||[]).unshift({id:Date.now(),d:today(),items,t:sub+sh,ad});put("myorders",orders);
 toast("Order sent on WhatsApp. You can see it in your account under My orders.")}
$("acct").onclick=()=>{mview=cur?"me":"in";renderAcc()};
$("acc").addEventListener("click",async e=>{
 const t=e.target.closest("[data-a3]"),a=t?t.dataset.a3:e.target.id=="acc"?"close":"";if(!a)return;
 try{
  if(a=="close"){$("acc").hidden=true;return}
  if(a.startsWith("v:")){mview=a.slice(2);renderAcc();if(useDB&&cur&&mview=="ord")dbMyOrders().then(l=>{myOrd=l;renderAcc()}).catch(()=>{});return}
  if(a=="login"){const ph=normPh($("ac-p").value),u=accts.find(x=>x.ph===ph);
   if(!okPh(ph))return aerr("Enter a valid mobile number, like 017XXXXXXXX.");
   if(useDB){const s=await authIn(pEmail(ph),$("ac-w").value),pr=await dbProfile(s.user.id);return loginAs({ph,n:pr?pr.n:"Customer",ad:pr?pr.ad||"":"",uid:s.user.id})}
   if(!u)return aerr("No account found for this number on this device. Please create one first.");
   if(await hashPw($("ac-w").value,unb64(u.salt))!==u.h)return aerr("Wrong password.");
   return loginAs(u)}
  if(a=="signup"){const n=$("ac-n").value.trim(),ph=normPh($("ac-p").value),pw=$("ac-w").value;
   if(!n)return aerr("Please enter your name.");
   if(!okPh(ph))return aerr("Enter a valid mobile number, like 017XXXXXXXX.");
   if(accts.some(x=>x.ph===ph))return aerr("An account with this number already exists. Please sign in.");
   if(pw.length<6)return aerr("Password must be at least 6 characters.");
   if(pw!==$("ac-w2").value)return aerr("The two passwords don’t match.");
   if(useDB){const s=await authUp(pEmail(ph),pw,{name:n,phone:ph}),ad2=$("ac-a").value.trim();await sb("/rest/v1/profiles",{method:"POST",headers:{Prefer:"return=minimal"},body:{id:s.user.id,n,ph,ad:ad2}});return loginAs({ph,n,ad:ad2,uid:s.user.id})}
   const salt=crypto.getRandomValues(new Uint8Array(16)),u={ph,n,ad:$("ac-a").value.trim(),salt:b64(salt),h:await hashPw(pw,salt)};
   accts.push(u);saveAccts();return loginAs(u)}
  if(a=="reset"){const ph=normPh($("ac-p").value),i=accts.findIndex(x=>x.ph===ph);
   if(i<0)return aerr("No account found for this number on this device.");
   accts.splice(i,1);saveAccts();delete orders[ph];put("myorders",orders);mview="up";renderAcc();toast("Account removed. Create it again with a new password.");return}
  if(a=="saveprof"){const n=$("ac-n").value.trim(),pw=$("ac-w").value;
   if(!n)return aerr("Please enter your name.");
   if(pw&&pw.length<6)return aerr("New password must be at least 6 characters.");
   if(useDB){const ad2=$("ac-a").value.trim();await sb("/rest/v1/profiles?id=eq."+cur.uid,{method:"PATCH",headers:{Prefer:"return=minimal"},body:{n,ad:ad2}});if(pw)await sb("/auth/v1/user",{method:"PUT",body:{password:pw}});cur.n=n;cur.ad=ad2;$("nm").value=cur.n;$("ad").value=cur.ad;accUI();renderCart();renderAcc();toast("Account updated.");return}
   cur.n=n;cur.ad=$("ac-a").value.trim();
   if(pw){const salt=crypto.getRandomValues(new Uint8Array(16));cur.salt=b64(salt);cur.h=await hashPw(pw,salt)}
   saveAccts();$("nm").value=cur.n;$("ad").value=cur.ad;accUI();renderCart();renderAcc();toast("Account updated.");return}
  if(a=="logout"){if(useDB)await authOut();cur=null;try{localStorage.removeItem("session")}catch(x){}$("nm").value=$("ph").value=$("ad").value="";accUI();renderCart();$("acc").hidden=true;toast("Signed out.");return}
  if(a.startsWith("reorder:")){const r=(useDB?myOrd:(orders[cur.ph]||[])).find(x=>x.id==a.slice(8));if(!r)return;let n=0;
   r.items.forEach(i=>{if(ok(byId(i.id))){cart[i.id]=Math.min(99,(cart[i.id]||0)+i.q);n++}});saveCart();$("acc").hidden=true;
   toast(n?"Items added to your cart.":"Those products are no longer available.");if(n)openCart(true)}
 }catch(x){aerr(useDB&&x&&x.message?fe(x.message):"Something went wrong. Please try again in an up-to-date browser.")}});
$("acc").addEventListener("change",e=>{if(e.target.id=="showpw")$("acc").querySelectorAll("input[data-pw]").forEach(i=>i.type=e.target.checked?"text":"password")});
$("acc").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.tagName=="INPUT"){const b=$("acc").querySelector("[data-primary]");if(b)b.click()}});

// ---- More menu ----
const mm=$("moremenu"),mb=$("more");
mb.onclick=()=>{const o=mm.hidden;mm.hidden=!o;mb.setAttribute("aria-expanded",String(o))};
document.addEventListener("click",e=>{if(!mm.hidden&&!e.target.closest("#more")){mm.hidden=true;mb.setAttribute("aria-expanded","false")}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){mm.hidden=true;$("acc").hidden=true}});
function renderAll(){renderChrome();accUI();aboutPage();renderNav();renderHero();renderPromo();renderCats();renderGrid();renderCart()}
handleRecovery();renderAll();adm();if(!hasDraft)loadPublished();if(useDB)dbInit();
</script>
